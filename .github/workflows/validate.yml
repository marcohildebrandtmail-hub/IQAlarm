name: Validate IQAlarm
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest pytest-cov ruff PyYAML voluptuous Pillow
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check custom_components/iqalarm/frontend/iqalarm-panel.js
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["2025.12.5", "2026.10.2"]
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm --entrypoint python -v "$PWD:/work" -w /work ghcr.io/home-assistant/home-assistant:${{ matrix.version }} scripts/verify_ha.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker run --rm -d --name iqalarm-browser --entrypoint python -p 127.0.0.1:18123:18123 -v "$PWD:/work" -w /work ghcr.io/home-assistant/home-assistant:2026.10.2 scripts/verify_ha.py --serve
      - run: python scripts/wait_for_ha.py
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
      - if: always()
        run: docker logs iqalarm-browser && docker stop iqalarm-browser
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
