[project]
name = "iqalarm"
version = "2.4.9"
description = "Spatially correlated multi-stage alarm for Home Assistant"
requires-python = ">=3.13.2"

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11", "PyYAML>=6", "voluptuous>=0.15", "Pillow>=11"]
ha-test = ["pytest-homeassistant-custom-component>=0.13.200"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
